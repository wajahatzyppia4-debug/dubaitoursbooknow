# OPTIONAL: deploy to Namecheap / cPanel hosting by FTP.
# Not needed on Vercel or Netlify. It only runs when the repository variable
# DEPLOY_TARGET is set to "ftp" (Settings > Secrets and variables > Actions > Variables)
# and these secrets exist: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
name: Deploy by FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.DEPLOY_TARGET == 'ftp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
